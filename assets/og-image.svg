<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="a1" cx="0.28" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="0.78" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#05060a"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1200" height="630" fill="url(#a1)"/>
  <rect width="1200" height="630" fill="url(#a2)"/>

  <g transform="translate(520 86)">
    <rect width="64" height="64" rx="15" fill="url(#logo)"/>
    <circle cx="32" cy="32" r="15.5" fill="none" stroke="#fff" stroke-width="4.5"/>
    <circle cx="32" cy="32" r="5.5" fill="#fff"/>
    <text x="80" y="45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#f5f7fb">Army</text>
  </g>

  <text x="600" y="280" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-3" fill="#f5f7fb">Partilha o teu ecrã.</text>
  <text x="600" y="378" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-3" fill="url(#text)">Em segundos.</text>

  <text x="600" y="460" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#9aa3b5">Mac e Windows · Rede local · Encriptado · Sem contas</text>

  <rect x="455" y="518" width="290" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
  <circle cx="482" cy="540" r="5" fill="#34d399"/>
  <text x="498" y="548" font-family="Menlo, monospace" font-size="20" fill="#cbd5e1">army.expressers.ao</text>
</svg>
